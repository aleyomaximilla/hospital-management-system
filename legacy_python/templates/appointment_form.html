{% extends 'base.html' %}
{% block title %}Book Appointment - Wellview Clinic{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Book appointment</h1>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">
            <div class="field">
                <label for="patient_id">Patient</label>
                <select id="patient_id" name="patient_id" required>
                    <option value="">Select patient...</option>
                    {% for p in patients %}
                    <option value="{{ p.id }}">{{ p.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="doctor_id">Doctor</label>
                <select id="doctor_id" name="doctor_id" required>
                    <option value="">Select doctor...</option>
                    {% for d in doctors %}
                    <option value="{{ d.id }}">Dr. {{ d.full_name }} — {{ d.specialization }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="appointment_date">Date</label>
                <input type="date" id="appointment_date" name="appointment_date" required>
            </div>
            <div class="field">
                <label for="appointment_time">Time</label>
                <input type="time" id="appointment_time" name="appointment_time" required>
            </div>
            <div class="field full-width">
                <label for="reason">Reason for visit</label>
                <input type="text" id="reason" name="reason" placeholder="e.g. Routine checkup">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Book appointment</button>
            <a href="{{ url_for('appointments') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

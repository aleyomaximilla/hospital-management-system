<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Wellview Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-screen">
        <div class="auth-box">
            <div class="brand">Middledown<span>Dispesary</span></div>
            <div class="subtitle">Hospital Management System</div>

            <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autofocus placeholder="[email protected]">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary">Log in</button>
            </form>

            <div class="auth-switch">
                No account yet? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>
</body>
</html>

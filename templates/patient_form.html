{% extends 'base.html' %}
{% block title %}{{ 'Edit' if patient else 'Register' }} Patient - Wellview Clinic{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Edit patient' if patient else 'Register new patient' }}</h1>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">
            <div class="field">
                <label for="full_name">Full name</label>
                <input type="text" id="full_name" name="full_name" required
                       value="{{ patient.full_name if patient else '' }}">
            </div>
            <div class="field">
                <label for="date_of_birth">Date of birth</label>
                <input type="date" id="date_of_birth" name="date_of_birth"
                       value="{{ patient.date_of_birth if patient else '' }}">
            </div>
            <div class="field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select...</option>
                    <option value="Male" {{ 'selected' if patient and patient.gender == 'Male' }}>Male</option>
                    <option value="Female" {{ 'selected' if patient and patient.gender == 'Female' }}>Female</option>
                    <option value="Other" {{ 'selected' if patient and patient.gender == 'Other' }}>Other</option>
                </select>
            </div>
            <div class="field">
                <label for="blood_group">Blood group</label>
                <input type="text" id="blood_group" name="blood_group" placeholder="e.g. O+"
                       value="{{ patient.blood_group if patient else '' }}">
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone"
                       value="{{ patient.phone if patient else '' }}">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       value="{{ patient.email if patient else '' }}">
            </div>
            <div class="field full-width">
                <label for="address">Address</label>
                <input type="text" id="address" name="address"
                       value="{{ patient.address if patient else '' }}">
            </div>
            <div class="field full-width">
                <label for="medical_history">Medical history / notes</label>
                <textarea id="medical_history" name="medical_history" rows="4">{{ patient.medical_history if patient else '' }}</textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Save changes' if patient else 'Register patient' }}</button>
            <a href="{{ url_for('patients') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

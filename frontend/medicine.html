<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Inventory - Middledown Dispensary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Medicine-page extras */
        .medicine-stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .medicine-stat-grid .stat-card { border-left: 4px solid var(--color-teal-500); }
        .medicine-stat-grid .stat-card.warn  { border-left-color: #b45309; }
        .medicine-stat-grid .stat-card.danger { border-left-color: var(--color-danger); }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .filter-bar input[type="search"] {
            flex: 1;
            min-width: 200px;
        }
        .filter-bar select { width: 180px; }

        /* Stock status badges */
        .badge-instock    { background: var(--color-success-bg); color: var(--color-success); }
        .badge-lowstock   { background: #fef3c7; color: #92400e; }
        .badge-outofstock { background: var(--color-danger-bg); color: var(--color-danger); }

        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(15,59,62,0.18);
            position: relative;
        }
        .modal-box h2 { margin-bottom: 20px; }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 18px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--color-text-muted);
            line-height: 1;
        }
        .modal-close:hover { color: var(--color-danger); }
        .modal-box .form-grid { gap: 14px; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: flex-end;
        }

        @media (max-width: 800px) {
            .medicine-stat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">Middledown <span>Dispensary</span></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="patients.html">Patients</a>
                <a href="doctors.html">Doctors</a>
                <a href="appointments.html">Appointments</a>
                <a href="billing.html">Billing</a>
                <a href="medicine.html" class="active">Medicine</a>
            </nav>
            <div class="user-box">
                Signed in as<br>
                <strong id="sidebar-name">Staff</strong>
                <div class="role-tag" id="sidebar-role">—</div>
            </div>
            <a href="index.html" class="logout-link" id="logout-btn">Log out</a>
        </aside>

        <!-- Main content -->
        <main class="content">
            <div class="page-header">
                <h1>Medicine Inventory</h1>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add Medicine</button>
            </div>

            <!-- Stats row -->
            <div class="medicine-stat-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">—</div>
                    <div class="stat-label">Total medicines</div>
                </div>
                <div class="stat-card warn">
                    <div class="stat-value" id="stat-low">—</div>
                    <div class="stat-label">Low stock (≤ 15 units)</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-value" id="stat-out">—</div>
                    <div class="stat-label">Out of stock</div>
                </div>
            </div>

            <!-- Filter bar -->
            <div class="filter-bar">
                <input type="search" id="search-input" placeholder="Search medicines…" oninput="applyFilters()">
                <select id="category-filter" onchange="applyFilters()">
                    <option value="">All categories</option>
                    <option>Antibiotic</option>
                    <option>Pain Relief</option>
                    <option>Cardiology</option>
                    <option>Diabetes</option>
                    <option>Antihistamine</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Table -->
            <table id="medicine-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Dosage</th>
                        <th>Stock (units)</th>
                        <th>Price (KES)</th>
                        <th>Expiry Date</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="medicine-tbody">
                    <tr class="empty-row"><td colspan="8">Loading medicines…</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="medicine-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()" title="Close">&times;</button>
            <h2 id="modal-title">Add Medicine</h2>

            <form id="medicine-form" onsubmit="handleMedicineFormSubmit(event)">
                <input type="hidden" id="medicine-id">

                <div class="form-grid">
                    <div class="field">
                        <label for="med-name">Medicine name *</label>
                        <input type="text" id="med-name" required placeholder="e.g. Amoxicillin">
                    </div>
                    <div class="field">
                        <label for="med-category">Category *</label>
                        <select id="med-category" required>
                            <option value="">Select category…</option>
                            <option>Antibiotic</option>
                            <option>Pain Relief</option>
                            <option>Cardiology</option>
                            <option>Diabetes</option>
                            <option>Antihistamine</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="med-dosage">Dosage</label>
                        <input type="text" id="med-dosage" placeholder="e.g. 500mg">
                    </div>
                    <div class="field">
                        <label for="med-stock">Stock quantity *</label>
                        <input type="number" id="med-stock" min="0" required placeholder="0">
                    </div>
                    <div class="field">
                        <label for="med-price">Price (KES) *</label>
                        <input type="number" id="med-price" min="0" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="field">
                        <label for="med-expiry">Expiry date</label>
                        <input type="date" id="med-expiry">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="modal-submit-btn" class="btn btn-primary">Add Medicine</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let allMedicines = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;
            setupSidebar();
            await loadStats();
            await loadMedicines();
        });

        function setupSidebar() {
            const user = getCurrentUser();
            if (user) {
                const el = document.getElementById('sidebar-name');
                const rt = document.getElementById('sidebar-role');
                if (el) el.textContent = user.full_name || 'Staff';
                if (rt) rt.textContent = user.role || '';
            }
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) logoutBtn.onclick = (e) => { e.preventDefault(); logout(); };
        }

        async function loadStats() {
            try {
                const res = await apiRequest('/medicines/stats');
                if (res.success) {
                    document.getElementById('stat-total').textContent = res.stats.total;
                    document.getElementById('stat-low').textContent   = res.stats.lowStock;
                    document.getElementById('stat-out').textContent   = res.stats.outOfStock;
                }
            } catch (err) {
                console.error('Stats error:', err.message);
            }
        }

        async function loadMedicines(search = '', category = '') {
            const tbody = document.getElementById('medicine-tbody');
            tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Loading…</td></tr>';
            try {
                const params = new URLSearchParams();
                if (search) params.append('search', search);
                if (category) params.append('category', category);
                const qs = params.toString() ? '?' + params.toString() : '';
                const res = await apiRequest('/medicines' + qs);
                allMedicines = res.data || [];
                renderTable(allMedicines);
            } catch (err) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="8">Error loading medicines: ${err.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('medicine-tbody');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="8">No medicines found.</td></tr>';
                return;
            }

            const currentUser = getCurrentUser();
            const isAdmin = currentUser && currentUser.role === 'admin';

            data.forEach(m => {
                const statusClass = m.status === 'In Stock'
                    ? 'badge badge-instock'
                    : m.status === 'Low Stock'
                        ? 'badge badge-lowstock'
                        : 'badge badge-outofstock';

                const formattedPrice = Number(m.price).toLocaleString(undefined, { minimumFractionDigits: 2 });
                const expiryDisplay = m.expiry_date || '—';

                const deleteBtn = isAdmin
                    ? `<button class="btn btn-danger btn-sm" onclick="deleteMedicine(${m.id}, '${escHtml(m.name)}')">Delete</button>`
                    : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escHtml(m.name)}</strong></td>
                    <td>${escHtml(m.category)}</td>
                    <td>${escHtml(m.dosage || '—')}</td>
                    <td>${m.stock_quantity}</td>
                    <td>KES ${formattedPrice}</td>
                    <td>${expiryDisplay}</td>
                    <td><span class="${statusClass}">${m.status}</span></td>
                    <td style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn btn-outline btn-sm" onclick="openEditModal(${m.id})">Edit</button>
                        ${deleteBtn}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.trim();
            const category = document.getElementById('category-filter').value;
            loadMedicines(search, category);
        }

        // ---- Modal ----

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add Medicine';
            document.getElementById('modal-submit-btn').textContent = 'Add Medicine';
            document.getElementById('medicine-form').reset();
            document.getElementById('medicine-id').value = '';
            document.getElementById('medicine-modal').classList.add('open');
        }

        async function openEditModal(id) {
            try {
                const res = await apiRequest(`/medicines/${id}`);
                const m = res.data;
                document.getElementById('modal-title').textContent = 'Edit Medicine';
                document.getElementById('modal-submit-btn').textContent = 'Save Changes';
                document.getElementById('medicine-id').value  = m.id;
                document.getElementById('med-name').value     = m.name;
                document.getElementById('med-category').value = m.category;
                document.getElementById('med-dosage').value   = m.dosage || '';
                document.getElementById('med-stock').value    = m.stock_quantity;
                document.getElementById('med-price').value    = m.price;
                document.getElementById('med-expiry').value   = m.expiry_date || '';
                document.getElementById('medicine-modal').classList.add('open');
            } catch (err) {
                showFlash(err.message || 'Could not load medicine details.', 'error');
            }
        }

        function closeModal() {
            document.getElementById('medicine-modal').classList.remove('open');
            document.getElementById('medicine-form').reset();
        }

        // Close modal when clicking outside
        document.getElementById('medicine-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        async function handleMedicineFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('medicine-id').value;
            const btn = document.getElementById('modal-submit-btn');
            btn.disabled = true;
            btn.textContent = 'Saving…';

            const data = {
                name:           document.getElementById('med-name').value.trim(),
                category:       document.getElementById('med-category').value,
                dosage:         document.getElementById('med-dosage').value.trim(),
                stock_quantity: parseInt(document.getElementById('med-stock').value, 10),
                price:          parseFloat(document.getElementById('med-price').value),
                expiry_date:    document.getElementById('med-expiry').value || null,
            };

            try {
                if (id) {
                    await apiRequest(`/medicines/${id}`, 'PUT', data);
                    showFlash('Medicine updated successfully!', 'success');
                } else {
                    await apiRequest('/medicines', 'POST', data);
                    showFlash('Medicine added successfully!', 'success');
                }
                closeModal();
                await loadStats();
                applyFilters();
            } catch (err) {
                showFlash(err.message || 'Could not save medicine.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = id ? 'Save Changes' : 'Add Medicine';
            }
        }

        async function deleteMedicine(id, name) {
            if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
            try {
                await apiRequest(`/medicines/${id}`, 'DELETE');
                showFlash(`"${name}" deleted.`, 'success');
                await loadStats();
                applyFilters();
            } catch (err) {
                showFlash(err.message || 'Could not delete medicine.', 'error');
            }
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str || ''));
            return div.innerHTML;
        }
    </script>
</body>
</html>

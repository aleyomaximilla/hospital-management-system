<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient - Wellview Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Wellview <span>Clinic</span></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="patients.html" class="active">Patients</a>
                <a href="doctors.html">Doctors</a>
                <a href="appointments.html">Appointments</a>
                <a href="billing.html">Billing</a>`n                <a href="medicine.html">Medicine</a>
            </nav>
            <div class="user-box">
                Signed in as<br>
                <strong>Maximilla</strong>
                <div class="role-tag">admin</div>
            </div>
            <a href="index.html" class="logout-link">Log out</a>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1>Register new patient</h1>
            </div>

            <div class="card">
                <form onsubmit="handlePatientFormSubmit(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="full_name">Full name</label>
                            <input type="text" id="full_name" name="full_name" required>
                        </div>
                        <div class="field">
                            <label for="date_of_birth">Date of birth</label>
                            <input type="date" id="date_of_birth" name="date_of_birth">
                        </div>
                        <div class="field">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender">
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="blood_group">Blood group</label>
                            <input type="text" id="blood_group" name="blood_group" placeholder="e.g. O+">
                        </div>
                        <div class="field">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" name="phone">
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="field full-width">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address">
                        </div>
                        <div class="field full-width">
                            <label for="medical_history">Medical history / notes</label>
                            <textarea id="medical_history" name="medical_history" rows="4"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Register patient</button>
                        <a href="patients.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Wellview Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Wellview <span>Clinic</span></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="patients.html">Patients</a>
                <a href="doctors.html">Doctors</a>
                <a href="appointments.html" class="active">Appointments</a>
                <a href="billing.html">Billing</a>`n                <a href="medicine.html">Medicine</a>
            </nav>
            <div class="user-box">
                Signed in as<br>
                <strong>Maximilla</strong>
                <div class="role-tag">admin</div>
            </div>
            <a href="index.html" class="logout-link">Log out</a>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1>Book appointment</h1>
            </div>

            <div class="card">
                <form onsubmit="handleAppointmentFormSubmit(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="patient_id">Patient</label>
                            <select id="patient_id" name="patient_id" required>
                                <option value="">Select patient...</option>
                                <option>Grace Wanjiru</option>
                                <option>Brian Otieno</option>
                                <option>Amina Hassan</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="doctor_id">Doctor</label>
                            <select id="doctor_id" name="doctor_id" required>
                                <option value="">Select doctor...</option>
                                <option>Dr. Peter Kamau — Cardiology</option>
                                <option>Dr. Faith Mwangi — Pediatrics</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="appointment_date">Date</label>
                            <input type="date" id="appointment_date" name="appointment_date" required>
                        </div>
                        <div class="field">
                            <label for="appointment_time">Time</label>
                            <input type="time" id="appointment_time" name="appointment_time" required>
                        </div>
                        <div class="field full-width">
                            <label for="reason">Reason for visit</label>
                            <input type="text" id="reason" name="reason" placeholder="e.g. Routine checkup">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Book appointment</button>
                        <a href="appointments.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

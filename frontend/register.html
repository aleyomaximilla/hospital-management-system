<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Wellview Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-screen">
        <div class="auth-box">
            <div class="brand">Middledown <span>Dispensary</span></div>
            <div class="subtitle">Create a staff account</div>

            <form onsubmit="handleRegisterSubmit(event)">
                <div class="field">
                    <label for="full_name">Full name</label>
                    <input type="text" id="full_name" name="full_name" required autofocus placeholder="Jane Doe">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="[email protected]">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="field">
                    <label for="role">Role</label>
                    <select id="role" name="role">
                        <option value="receptionist">Receptionist</option>
                        <option value="doctor">Doctor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary">Create account</button>
            </form>

            <div class="auth-switch">
                Already have an account? <a href="index.html">Log in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function handleRegisterSubmit(event) {
            event.preventDefault();
            const full_name = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const res = await apiRequest('/auth/register', 'POST', {
                    full_name,
                    email,
                    password,
                    role
                });
                showFlash('Account created successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (err) {
                showFlash(err.message || 'Registration failed.', 'error');
                btn.disabled = false;
                btn.textContent = 'Create account';
            }
        }
    </script>
</body>
</html>

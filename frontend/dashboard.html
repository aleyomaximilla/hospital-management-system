<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Middledown Dispesary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Middledown <span>Dispesary</span></div>
            <nav>
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="patients.html">Patients</a>
                <a href="doctors.html">Doctors</a>
                <a href="medicine.html">Medicines</a>
                <a href="appointments.html">Appointments</a>
                <a href="billing.html">Billing</a>
            </nav>
            <div class="user-box">
                Signed in as<br>
                <strong>Maximilla</strong>
                <div class="role-tag">admin</div>
            </div>
            <a href="index.html" class="logout-link">Log out</a>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1>Dashboard</h1>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-patients">0</div>
                    <div class="stat-label">Registered patients</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-doctors">0</div>
                    <div class="stat-label">Doctors on staff</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-appointments-today">0</div>
                    <div class="stat-label">Scheduled appointments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-unpaid-bills">0</div>
                    <div class="stat-label">Unpaid bills</div>
                </div>
            </div>

            <h2>Upcoming appointments</h2>
            <table id="upcoming-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Bill - Wellview Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Wellview <span>Clinic</span></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="patients.html">Patients</a>
                <a href="doctors.html">Doctors</a>
                <a href="appointments.html">Appointments</a>
                <a href="billing.html" class="active">Billing</a>`n                <a href="medicine.html">Medicine</a>
            </nav>
            <div class="user-box">
                Signed in as<br>
                <strong>Maximilla</strong>
                <div class="role-tag">admin</div>
            </div>
            <a href="index.html" class="logout-link">Log out</a>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1>Create bill</h1>
            </div>

            <div class="card">
                <form onsubmit="handleBillFormSubmit(event)">
                    <div class="form-grid">
                        <div class="field full-width">
                            <label for="patient_id">Patient</label>
                            <select id="patient_id" name="patient_id" required>
                                <option value="">Select patient...</option>
                                <option>Grace Wanjiru</option>
                                <option>Brian Otieno</option>
                                <option>Amina Hassan</option>
                            </select>
                        </div>
                        <div class="field full-width">
                            <label for="description">Description</label>
                            <input type="text" id="description" name="description" required placeholder="e.g. Consultation fee">
                        </div>
                        <div class="field">
                            <label for="amount">Amount (KES)</label>
                            <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create bill</button>
                        <a href="billing.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
